<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Saved reconciliation</title><link rel="stylesheet" th:href="@{/styles.css}"><link rel="stylesheet" th:href="@{/readability.css(v=3)}"></head>
<body><header class="topbar"><a class="brand" th:href="@{/dashboard}">GST Reconciliation</a><nav class="nav-actions"><a th:href="@{/dashboard}">Dashboard</a><a th:href="@{/history}">Run history</a><a th:if="${canUpload}" th:href="@{/}">New run</a><a th:if="${isAdmin}" th:href="@{/admin/users}">Users</a><span class="user-chip" th:text="${currentUser}"></span><form method="post" th:action="@{/logout}"><button class="link-button" type="submit">Sign out</button></form></nav></header><main class="container wide"><div class="title-row"><div><p class="eyebrow">RUN <span th:text="${run.id}"></span></p><h1>Saved reconciliation</h1><p class="muted" th:text="${run.booksFile + ' · ' + run.portalFile}"></p></div><a class="button secondary" th:href="@{/download/{id}(id=${run.id})}">Download Excel report</a></div><section class="cards"><div class="card"><span>Matched</span><strong th:text="${run.totalMatched}"></strong></div><div class="card amber"><span>Mismatch</span><strong th:text="${run.totalMismatch}"></strong></div><div class="card red"><span>Missing in GST</span><strong th:text="${run.missingInGst}"></strong></div><div class="card"><span>Missing in Books</span><strong th:text="${run.missingInBooks}"></strong></div><div class="card risk"><span>ITC at risk</span><strong th:text="${#numbers.formatDecimal(run.itcAtRisk,1,'COMMA',2,'POINT')}"></strong></div></section><section class="panel"><div class="table-wrap"><table><thead><tr><th>Status</th><th>GSTIN</th><th>Supplier</th><th>Books invoice</th><th>Portal invoice</th><th>Books tax</th><th>Portal tax</th><th>Similarity</th><th>Remarks</th></tr></thead><tbody><tr th:each="r : ${results}"><td th:text="${r.status}"></td><td th:text="${r.gstin}"></td><td th:text="${r.supplierName}"></td><td th:text="${r.booksInvoice ?: '—'}"></td><td th:text="${r.portalInvoice ?: '—'}"></td><td th:text="${r.booksTax == null ? '—' : #numbers.formatDecimal(r.booksTax,1,'COMMA',2,'POINT')}"></td><td th:text="${r.portalTax == null ? '—' : #numbers.formatDecimal(r.portalTax,1,'COMMA',2,'POINT')}"></td><td th:text="${#numbers.formatDecimal(r.similarity,1,3)}"></td><td th:text="${r.remarks}"></td></tr></tbody></table></div></section></main></body></html>
