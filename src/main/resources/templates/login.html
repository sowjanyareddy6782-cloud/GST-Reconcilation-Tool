<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · GST Reconciliation</title><link rel="stylesheet" th:href="@{/styles.css}"><link rel="stylesheet" th:href="@{/readability.css(v=3)}"></head>
<body class="auth-page"><main class="auth-shell"><a class="brand auth-brand" th:href="@{/login}">GST Reconciliation</a><section class="panel auth-panel"><p class="eyebrow">SECURE WORKSPACE</p><h1>Sign in</h1><p class="muted">Use your organization account to access reconciliation data.</p><div class="alert error" th:if="${param.error}">Username or password is incorrect.</div><div class="alert success" th:if="${param.logout}">You have been signed out.</div><form method="post" th:action="@{/login}"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button></form></section><p class="auth-foot">Access is managed by your GST reconciliation administrator.</p></main></body>
</html>
