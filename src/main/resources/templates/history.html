<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Run history</title><link rel="stylesheet" th:href="@{/styles.css}"><link rel="stylesheet" th:href="@{/readability.css(v=3)}"></head>
<body><header class="topbar"><a class="brand" th:href="@{/dashboard}">GST Reconciliation</a><nav class="nav-actions"><a th:href="@{/dashboard}">Dashboard</a><a th:if="${canUpload}" th:href="@{/}">New run</a><a th:if="${isAdmin}" th:href="@{/admin/users}">Users</a><span class="user-chip" th:text="${currentUser}"></span><form method="post" th:action="@{/logout}"><button class="link-button" type="submit">Sign out</button></form></nav></header><main class="container wide"><p class="eyebrow">SAVED RUNS</p><h1>Reconciliation history</h1><div class="panel alert error" th:if="${error}" th:text="${error}"></div><div class="panel table-wrap"><table><thead><tr><th>Run</th><th>Time</th><th>Purchase register</th><th>GSTR-2B file</th><th>Matched</th><th>Mismatch</th><th>Missing in GST</th><th>ITC at risk</th><th></th></tr></thead><tbody><tr th:each="run : ${runs}"><td th:text="${run.id}"></td><td th:text="${#temporals.format(run.runTime,'yyyy-MM-dd HH:mm')}"></td><td th:text="${run.booksFile}"></td><td th:text="${run.portalFile}"></td><td th:text="${run.totalMatched}"></td><td th:text="${run.totalMismatch}"></td><td th:text="${run.missingInGst}"></td><td th:text="${#numbers.formatDecimal(run.itcAtRisk,1,'COMMA',2,'POINT')}"></td><td><a th:href="@{/history/{id}(id=${run.id})}">Details</a></td></tr><tr th:if="${#lists.isEmpty(runs)}"><td colspan="9" class="muted">No reconciliations saved yet.</td></tr></tbody></table></div></main></body></html>
